network:
  protocol: http
  interface: 0.0.0.0
  websocket_port: 6080
  use_ipv4: true
  use_ipv6: false
  ssl:
    require_ssl: false

desktop:
  resolution:
    width: 1280
    height: 800
  allow_resize: true
  pixel_depth: 24

encoding:
  max_frame_rate: 60
  hextile_improved_compression: true

server:
  http:
    headers:
      - Cross-Origin-Embedder-Policy=require-corp
      - Cross-Origin-Opener-Policy=same-origin
    httpd_directory: /usr/share/kasmvnc/www
  advanced:
    kasm_password_file: /home/osgsuken/.kasmpasswd

command_line:
  prompt: false
