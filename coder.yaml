# Coder サーバー設定 (数学研究部クラウド開発ポータル)
# 秘密情報 (client_secret 等) はこのファイルに書かず、環境変数 CODER_OIDC_CLIENT_SECRET で注入する。
# 開発時は mock-oidc (scripts/mock-oidc.js)、本番は学校の実 OIDC プロバイダを指定する。

networking:
  accessURL: "http://localhost:7081"
  http:
    httpAddress: "0.0.0.0:7081"
    # メールアドレス / パスワードログインを無効化（SSOログイン専用）
    disablePasswordAuth: true

telemetry:
  enable: false

oidc:
  # 開発: http://localhost:8090 (mock-oidc)
  # 本番: 学校の Google/Microsoft の issuer URL に書き換える
  issuerURL: "http://localhost:8090"
  clientID: "school-cloud-client"
  # client_secret は環境変数 CODER_OIDC_CLIENT_SECRET で注入 (Git に載せない)
  allowSignups: true
  emailDomain:
    - "school.ed.jp"
  signInText: "学校アカウント (SSO) でログイン"
  ignoreEmailVerified: true
